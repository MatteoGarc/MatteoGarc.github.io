<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boussole 3D Nord Réel + Carte</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 100vw; height: 100vh; overflow: hidden; font-family: Arial, sans-serif; }

        #video {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
        }

        #canvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
        }

        #info {
            position: fixed; top: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px 30px;
            border-radius: 20px;
            z-index: 3;
            font-size: 24px; font-weight: bold;
            text-align: center; backdrop-filter: blur(10px);
        }

        #direction { font-size: 48px; color: #4CAF50; margin-bottom: 5px; }
        #degrees { font-size: 18px; color: #ddd; }

        #map {
            position: fixed;
            bottom: 20px; right: 20px;
            width: 300px; height: 200px;
            border: 2px solid #333; border-radius: 10px;
            z-index: 3;
        }

        #error {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,0,0,0.9);
            color: white; padding: 20px; border-radius: 10px;
            z-index: 4; display: none; text-align: center;
            max-width: 80%;
        }

        #permissionBtn {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%);
            background: #4CAF50; color: white;
            border: none; padding: 15px 30px;
            border-radius: 25px; font-size: 18px;
            font-weight: bold; cursor: pointer;
            z-index: 3; display: none;
        }

        #permissionBtn:active { background: #45a049; }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <div id="info">
        <div id="direction">N</div>
        <div id="degrees">0°</div>
    </div>

    <div id="map"></div>
    <div id="error"></div>
    <button id="permissionBtn">Activer l'orientation</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        let scene, camera, renderer, compass, needle;
        let currentHeading = 0;       // orientation réelle du téléphone
        let bearingToTarget = null;   // direction du point sélectionné sur la carte
        let targetHeading = 0;        // angle relatif à afficher
        let userLat = 48.8566, userLon = 2.3522;
        let marker = null, map;
        let hasOrientationPermission = false;

        // --- Initialisation caméra arrière ---
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
            } catch (err) {
                showError("Impossible d'accéder à la caméra: " + err.message);
            }
        }

        // --- Carte Leaflet ---
        function initMap() {
            map = L.map('map').setView([userLat, userLon], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            // Clic sur la carte → placer un marqueur et calculer le cap vers la cible
            map.on('click', e => {
                const { lat, lng } = e.latlng;
                if (marker) marker.remove();
                marker = L.marker([lat, lng]).addTo(map);
                bearingToTarget = computeBearing(userLat, userLon, lat, lng);
                updateRelativeHeading();
            });

            // Centrer la carte sur la position actuelle si disponible
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    userLat = pos.coords.latitude;
                    userLon = pos.coords.longitude;
                    map.setView([userLat, userLon], 13);
                });
            }
        }

        // --- Calcul direction géographique entre deux points ---
        function computeBearing(lat1, lon1, lat2, lon2) {
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            const y = Math.sin(Δλ) * Math.cos(φ2);
            const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        // --- Combine orientation du téléphone et direction vers la cible ---
        function updateRelativeHeading() {
            if (bearingToTarget === null) {
                targetHeading = (360 - currentHeading) % 360; // boussole : nord réel
            } else {
                targetHeading = (bearingToTarget - currentHeading + 360) % 360; // direction vers la cible
            }
            updateDirectionDisplay((targetHeading + 270) % 360);
        }

        // --- Orientation réelle du téléphone ---
        function handleOrientation(event) {
            if (event.absolute || event.alpha !== null) {
                currentHeading = 360 - event.alpha; // 0° = Nord
                updateRelativeHeading();
            }
        }

        async function requestOrientationPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        hasOrientationPermission = true;
                        window.addEventListener('deviceorientation', handleOrientation);
                        permissionBtn.style.display = 'none';
                    } else {
                        showError("Permission d'orientation refusée");
                    }
                } catch (err) {
                    showError("Erreur: " + err.message);
                }
            } else {
                hasOrientationPermission = true;
                window.addEventListener('deviceorientation', handleOrientation);
                permissionBtn.style.display = 'none';
            }
        }

        // --- Initialisation de la scène Three.js ---
        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 5);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);

            const light = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(light);

            createCompass();
            animate();
        }

        // --- Création de la boussole ---
        function createCompass() {
            const compassGroup = new THREE.Group();

            // Base circulaire
            const base = new THREE.Mesh(
                new THREE.CylinderGeometry(2, 2, 0.3, 32),
                new THREE.MeshPhongMaterial({ color: 0x2c3e50, metalness: 0.5, roughness: 0.5 })
            );
            compassGroup.add(base);

            // Anneau doré extérieur
            const ring = new THREE.Mesh(
                new THREE.TorusGeometry(2.1, 0.15, 16, 32),
                new THREE.MeshPhongMaterial({ color: 0xd4af37, metalness: 0.8, roughness: 0.2 })
            );
            ring.rotation.x = Math.PI / 2;
            compassGroup.add(ring);

            // Groupe de l’aiguille
            needle = new THREE.Group();

            // Partie nord (rouge)
            const north = new THREE.Mesh(
                new THREE.ConeGeometry(0.15, 1.2, 4),
                new THREE.MeshPhongMaterial({ color: 0xff0000 })
            );
            north.rotation.z = Math.PI / 2;
            north.position.x = -0.6;
            north.position.y = 0.2;
            needle.add(north);

            // Partie sud (blanche)
            const south = new THREE.Mesh(
                new THREE.ConeGeometry(0.15, 1.2, 4),
                new THREE.MeshPhongMaterial({ color: 0xffffff })
            );
            south.rotation.z = -Math.PI / 2;
            south.position.x = 0.6;
            south.position.y = 0.2;
            needle.add(south);

            // Centre doré
            const center = new THREE.Mesh(
                new THREE.SphereGeometry(0.2, 16, 16),
                new THREE.MeshPhongMaterial({ color: 0xd4af37, metalness: 0.8 })
            );
            center.position.y = 0.2;
            needle.add(center);

            compassGroup.add(needle);
            scene.add(compassGroup);

            compass = compassGroup;
        }

        // --- Animation continue ---
        function animate() {
            requestAnimationFrame(animate);
            if (needle) {
                // ✅ Rotation corrigée : plus besoin d’un offset artificiel
                const targetRot = -targetHeading * Math.PI / 180;
                needle.rotation.y += (targetRot - needle.rotation.y) * 0.1;
            }
            renderer.render(scene, camera);
        }

        // --- Affichage du texte de direction ---
        function updateDirectionDisplay(deg) {
            deg = Math.round(deg);
            document.getElementById('degrees').textContent = deg + '°';
            const dirs = ['N','NE','E','SE','S','SW','W','NW'];
            const idx = Math.round(deg / 45) % 8;
            document.getElementById('direction').textContent = dirs[idx];
        }

        function showError(msg) {
            const div = document.getElementById('error');
            div.textContent = msg;
            div.style.display = 'block';
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Lancement ---
        initCamera();
        initThree();
        initMap();

        // --- Permissions pour iOS ---
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            permissionBtn.style.display = 'block';
            permissionBtn.addEventListener('click', requestOrientationPermission);
        } else {
            window.addEventListener('deviceorientation', handleOrientation);
        }
    </script>
</body>
</html>
